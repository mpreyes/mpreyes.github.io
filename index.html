        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Madelyn Reyes",
        "url": "https://mpreyes.github.io/",

        "jobTitle": "Software Engineer",
        "description": "Software engineer, musician (madebit) and founder of Akta.",

  <body>
    <header>
      <h1>Madelyn Reyes</h1>
      <span id="coins" hidden></span>
      <button id="photo" type="button" hidden>PHOTO</button>
      <button id="sound" type="button" aria-pressed="true">SOUND ON</button>
    </header>
    <main>
      <nav class="sr-only" aria-label="Projects">
        <h2>Things I make</h2>
        <ul>
          <li><a href="https://aktadating.com">Akta</a>: singles events in Nashville</li>
          <li><a href="https://mpreyes.github.io/mash-adventure-web/">M.A.S.H. Adventure</a>: a fortune telling story game</li>
          <li><a href="https://madebit.studio">madebit</a>: my music</li>
          <li>The farm: coming soon</li>
        </ul>
      </nav>
      <div class="stage">
        <svg id="map" viewBox="0 0 1440 800" role="img" aria-label="A little island town. Each building is one of Madelyn's projects."></svg>
        <button class="pan" id="pan-left" aria-label="Look left" hidden>◀</button>
        <button class="pan" id="pan-right" aria-label="Look right" hidden>▶</button>
        <div class="card" id="card" role="status" hidden>
          <b id="card-title"></b>
          <span id="card-sub"></span>
          <a id="card-go" href="#" target="_blank" rel="noreferrer">VISIT ↗</a>
        </div>
      </div>
    </main>
    <footer>
      <a href="https://www.instagram.com/mpreyes09/" target="_blank" rel="noreferrer">Instagram</a>
      <a href="https://www.tiktok.com/@madelini38" target="_blank" rel="noreferrer">TikTok</a>
      <a href="https://www.linkedin.com/in/madelyn-reyes/" target="_blank" rel="noreferrer">LinkedIn</a>
      <a href="https://github.com/mpreyes" target="_blank" rel="noreferrer">GitHub</a>
    </footer>
    <dialog id="photo-dialog" aria-label="Family photo">
      <img id="photo-img" alt="A pixel family photo: the family in front of their green house, with Madelyn and Luna" />
      <div class="photo-actions">
        <a id="photo-save" download="la-familia.png">SAVE</a>
        <button type="button" id="photo-close">CLOSE</button>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
